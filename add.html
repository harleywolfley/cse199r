<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Infraction</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <header>
        <h1><a href="index.html">I D I O T</a></h1>
        <p>Integrated Driving Infraction Observation Tracker</p>
        <hr>
        <nav>
            <ul>
                <li><a href="add.html">Add Infraction</a></li>
                <li><a href="find.html">Find Infraction</a></li>
            </ul>
        </nav>
    </header>
    <img class="heroimg" src="report.png">
    <main id="addmain">
        <form id="infrac-input-div">
            <label for="save-plate">Plate:</label>
            <input type="text" id="save-plate" name="save-plate" placeholder="1M W23IO" required>
            <label for="save-dattime">Date & Time:</label>
            <input type="text" id="save-dattime" name="save-dattime">
            <label for="save-location">Location:</label>
            <input type="text" id="save-location" name="save-location">
            <label for="save-infrac">Infraction Type:</label>
            <input type="text" id="save-infrac" name="save-infrac">
            <label for="save-desc">Description:</label>
            <input type="text" id="save-desc" name="save-desc">
            <label for="save-vid-path">Video Path:</label>
            <input type="text" id="save-vid-path" name="save-vid-path">
            <button type="submit" id="button-save-infrac">Save</button>
        </form>
        <div id="last-input-infrac">
            <h3 id="display-plate">Last Saved:</h3>
            <h4>Plate:</h4>
            <p>para</p>
            <h4>Date & Time:</h4>
            <p>para</p>
            <h4>Location</h4>
            <p>para</p>
            <h4>Infraction Type:</h4>
            <p>para</p>
            <h4>Description:</h4>
            <p>para</p>
            <h4>Video Path:</h4>
            <p>para</p>
        </div>
    </main>
    <footer><p>&copy; Harley Wolfley Furrows 2026</p></footer>
</body>
</html>
